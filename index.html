const t=k=>words[k][+$('lang').value];let provider=null;

function units(s,d){if(!/^\d+(\.\d+)?$/.test(s))throw Error(t('invalid'));const [a,b='']=s.split('.');if(b.length>d)throw Error(t('invalid'));const n=BigInt(a+b.padEnd(d,'0'));if(n<1n||n>18446744073709551615n)throw Error(t('invalid'));return n}

const ata=spl.getAssociatedTokenAddressSync(mint,owner,false,id),tx=new w.Transaction().add(w.SystemProgram.createAccount({fromPubkey:owner,newAccountPubkey:mint,space,lamports:rent,programId:id}),spl.createInitializeMetadataPointerInstruction(mint,null,mint,id),spl.createInitializeMint2Instruction(mint,d,owner,$('freeze').checked?null:owner,id),md.createInitializeInstruction({programId:id,metadata:mint,updateAuthority:owner,mint,mintAuthority:owner,name,symbol,uri:''}),...meta.additionalMetadata.map(([field,value])=>md.createUpdateFieldInstruction({programId:id,metadata:mint,updateAuthority:owner,field,value})),...($('immutable').checked?[md.createUpdateAuthorityInstruction({programId:id,metadata:mint,oldAuthority:owner,newAuthority:null})]:[]),spl.createAssociatedTokenAccountInstruction(owner,ata,owner,mint,id),spl.createMintToCheckedInstruction(mint,ata,owner,quantity,d,[],id),...($('revoke').checked?[spl.createSetAuthorityInstruction(mint,owner,spl.AuthorityType.MintTokens,null,[],id)]:[]));const charge=owner.toString()===ADMIN?0:100000000;if(charge)tx.add(w.SystemProgram.transfer({fromPubkey:owner,toPubkey:new w.PublicKey(ADMIN),lamports:charge}));

function base58(bytes){const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let n=0n,out='',zeros=0;for(const b of bytes)n=n*256n+BigInt(b);while(n){out=alphabet[Number(n%58n)]+out;n/=58n}while(zeros<bytes.length&&bytes[zeros]===0)zeros++;return '1'.repeat(zeros)+out}

async function vanityKey(w){const part=$('vanity').value;const method=$('side').value==='start'?'startsWith':'endsWith';if(!part)return w.Keypair.generate();statusMsg(t('search'));const end=Date.now()+45000;while(Date.now()<end){for(let i=0;i<30;i++){const k=w.Keypair.generate();if(k.publicKey.toBase58()[method](part))return k}await new Promise(r=>setTimeout(r,0))}throw Error(t('timeout'))}

(async()=>{const q=new URLSearchParams(location.search);if(!q.has('mint'))return;const el=$('profile');el.hidden=false;el.scrollIntoView();try{const net=q.get('network');if(!['devnet','testnet'].includes(net))throw Error('Network');const [w,spl]=await libs(),c=new w.Connection(w.clusterApiUrl(net),'confirmed'),mint=new w.PublicKey(q.get('mint')),meta=await spl.getTokenMetadata(c,mint),supply=await c.getTokenSupply(mint);el.textContent=[meta.name+' · '+meta.symbol,net,mint.toString(),t('supply')+' · '+supply.value.uiAmountString,...meta.additionalMetadata.map(pair=>pair.join(' · '))].join('\n')}catch(e){el.textContent=e.message}})();
